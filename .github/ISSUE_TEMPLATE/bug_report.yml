name: 🐛 Bug 报告
description: 报告插件的故障或异常行为
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！提交前请先搜一下有没有重复的 issue。

  - type: input
    id: dsh_version
    attributes:
      label: DSH 版本
      description: 例如 `0.1.0-rc.7`
      placeholder: 0.1.0-rc.x
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      description: 例如 `0.1.3`
      placeholder: 0.1.x
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 发生了什么？你期望什么？
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何稳定复现？
      placeholder: |
        1. 打开某个会话
        2. 执行某操作
        3. 观察到…

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 浏览器、操作系统、主题等
      placeholder: 如 Chrome 130 / macOS / 深海女仆主题

  - type: textarea
    id: logs
    attributes:
      label: 控制台报错（如有）
      description: 浏览器开发者工具 Console 里的红色报错
      render: shell
