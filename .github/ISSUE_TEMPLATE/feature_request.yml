name: ✨ 功能建议
description: 提一个功能或改进想法
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 想解决什么问题
      description: 描述你的使用场景和痛点
      placeholder: 例如：长会话里已完成的工具调用能不能折叠起来，只留当前正在执行的步骤…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的行为
      description: 你希望插件怎么工作？

  - type: textarea
    id: reference
    attributes:
      label: 参考（可选）
      description: 有没有类似产品/插件的效果可参考？
      placeholder: 例如 qoder 的折叠效果
